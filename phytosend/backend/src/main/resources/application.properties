# Configurazione dell'applicazione Spring Boot
spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5432/phytosend_db
spring.datasource.username=phytouser
spring.datasource.password=phytopassword
spring.jpa.hibernate.ddl-auto=update

# Esegue data.sql dopo che Hibernate ha creato le tabelle
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never

# Frontend Configuration
app.frontend.url=http://localhost:5173

# JWT Configuration
jwt.secret=phytosendSecretKeyWithAtLeast256BitsForSecurityRequiresBase64Ideally
jwt.expiration=86400000

# File Upload Configuration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB