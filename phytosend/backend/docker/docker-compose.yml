name: phytosend

services:
  # DATABASE
  db:
    image: postgres:17.6
    container_name: phytosend-db
    restart: always
    environment:
      POSTGRES_DB: phytosend_db
      POSTGRES_USER: phytouser
      POSTGRES_PASSWORD: phytopassword
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - phytosend-network

  # BACKEND
  backend:
    build:
      context: ..
      dockerfile: DockerFile
    container_name: phytosend-backend
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - ../uploads:/app/uploads
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/phytosend_db
      - SPRING_DATASOURCE_USERNAME=phytouser
      - SPRING_DATASOURCE_PASSWORD=phytopassword
      - APP_UPLOAD_DIR=/app/uploads
    depends_on:
      - db
    networks:
      - phytosend-network

  # FRONTEND
  frontend:
    build:
      context: ../../frontend
      dockerfile: DockerFile
    container_name: phytosend-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - phytosend-network

  # LOKI (Log Database)
  loki:
    image: grafana/loki:3.0.0
    container_name: phytosend-loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki/lokiconfig.yaml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - phytosend-network

  # PROMTAIL (Log Shipper)
  promtail:
    image: grafana/promtail:3.0.0
    container_name: phytosend-promtail
    volumes:
      - ./promtail/promtail-config.yaml:/etc/promtail/config.yml
      # Mappa il socket di Docker per permettere a Promtail di leggere i log dei container
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - phytosend-network

  # PROMETHEUS (Metrics Database)
  prometheus:
    image: prom/prometheus:v3.0.0
    container_name: phytosend-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yaml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    depends_on:
      - backend
    networks:
      - phytosend-network

  # GRAFANA (Dashboard UI)
  grafana:
    image: grafana/grafana:11.0.0
    container_name: phytosend-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - loki
      - prometheus
    networks:
      - phytosend-network

volumes:
  db_data:

networks:
  phytosend-network:
    driver: bridge
