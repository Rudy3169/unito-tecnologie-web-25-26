name: phytosend-dev

services:
  # DATABASE (uguale alla produzione, non cambia)
  db:
    image: postgres:17.6
    build:
      context: ./postgre
      dockerfile: DockerFile
    restart: always
    environment:
      POSTGRES_DB: phytosend_db
      POSTGRES_USER: phytouser
      POSTGRES_PASSWORD: phytopassword
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - phytosend-network

  # BACKEND - modalità sviluppo (hot reload con Spring DevTools)
  backend:
    image: maven:3.9-eclipse-temurin-25-alpine
    working_dir: /app
    # Esegue direttamente dal sorgente invece di compilare un JAR
    command: ./mvnw spring-boot:run
    volumes:
      # Monta la cartella backend reale dentro il container
      - ..:/app
      # Riusa la cache Maven locale per non riscaricare i JAR ogni volta
      - maven_cache:/root/.m2
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/phytosend_db
      - SPRING_DATASOURCE_USERNAME=phytouser
      - SPRING_DATASOURCE_PASSWORD=phytopassword
      - SPRING_DEVTOOLS_RESTART_ENABLED=true
    depends_on:
      - db
    networks:
      - phytosend-network

  # FRONTEND - modalità sviluppo (Vite dev server con HMR)
  frontend:
    image: node:20-alpine
    working_dir: /app
    # Installa i pacchetti e avvia Vite in modalità dev
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      # Monta la cartella frontend reale dentro il container
      - ../../frontend:/app
      # Volume anonimo per evitare che il mount sovrascriva i node_modules del container
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_TARGET=http://backend:8080
    depends_on:
      - backend
    networks:
      - phytosend-network

volumes:
  db_data:
  maven_cache:

networks:
  phytosend-network:
    driver: bridge
