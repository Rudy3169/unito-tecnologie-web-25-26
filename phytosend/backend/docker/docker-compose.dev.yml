name: phytosend-dev

services:
  # DATABASE
  db:
    image: postgres:17.6
    restart: always
    environment:
      POSTGRES_DB: phytosend_db
      POSTGRES_USER: phytouser
      POSTGRES_PASSWORD: phytopassword
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - phytosend-network

  # BACKEND
  backend:
    image: maven:3.9-eclipse-temurin-25-alpine
    working_dir: /app
    command: ./mvnw spring-boot:run
    volumes:
      - ..:/app
      - maven_cache:/root/.m2
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/phytosend_db
      - SPRING_DATASOURCE_USERNAME=phytouser
      - SPRING_DATASOURCE_PASSWORD=phytopassword
      - SPRING_DEVTOOLS_RESTART_ENABLED=true
    depends_on:
      - db
    networks:
      - phytosend-network

  # FRONTEND
  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ../../frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_TARGET=http://backend:8080
    depends_on:
      - backend
    networks:
      - phytosend-network

volumes:
  db_data:
  maven_cache:

networks:
  phytosend-network:
    driver: bridge
